<!DOCTYPE html>
<html lang="en">
<head>
    <!--Hecho por Anthony-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud de Eventos</title>
</head>
<body>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <head>
        <style>
        body {
            background-color: #F5F5F5;
            min-height: 100uh;
            padding: 20px u;
        }
        .main-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgb(0, 0, 0, 0.2);
        }
    </style>
    </head>

    <body>
        <main class="container py-5">

            <section class="text-center mb-5 text-dark">
                <h1 class="fw-bold mb-3">Gestion de registro</h1>
                <p class="lead text-muted">CRUD - consume Api rest de Eventos</p>
            </section>

            <div class="main-container p-4">

                <!--Hecho por Anthony-->
                <section class="card shadow-sm mb-5">
                    <div class="card-header bg-primary text-white">
                        <h2 class="h5 mb-0">Agregar o editar registro</h2>
                    </div>

                    <div class="card-body">
                        <form id="formRegistro">

                            <!--Campo oculto para el ID-->
                            <input type="hidden" id="txtID">

                            <div class="form-group my-3">
                                <label for="txtClienteID" class="form-label">ClienteID</label>
                                <input type="text" id="txtClienteID" class="form-control" placeholder="Don Bosco" required>
                            </div>

                            <div class="form-group my-3">
                                <label for="txtSalonID" class="form-label">SalonID</label>
                                <input type="text" id="txtSalonID" class="form-control" placeholder="Galdamez" required>
                            </div>

                            <div class="form-group my-3">
                                <label for="txtNombreEvento" class="form-label">NombreEvento</label>
                                <input type="text" id="txtNombreEvento" class="form-control" placeholder="7998-9210" required>
                            </div>

                            <div class="form-group my-3">
                                <label for="txtFechaEvento" class="form-label">FechaEvento</label>
                                <input type="text" id="txtFechaEvento" class="form-control" placeholder="7998-9210" required>
                            </div>

                            <div class="form-group my-3">
                                <label for="txtCantidadPersonas" class="form-label">CantidadPersonas</label>
                                <input type="text" id="txtCantidadPersonas" class="form-control" placeholder="Anthony@gmail.com" required>
                            </div>

                            <div class="form-group my-3">
                                <label for="txtCantidadHoras" class="form-label">CantidadHoras</label>
                                <input type="text" id="txtCantidadHoras" class="form-control" placeholder="Anthony@gmail.com" required>
                            </div>

                            <div class="form-group my-3">
                                <label for="txtEstado" class="form-label">Estado</label>
                                <input type="text" id="txtEstado" class="form-control" placeholder="Anthony@gmail.com" required>
                            </div>

                            <div class="form-group my-3">
                                <label for="txtTotalPago" class="form-label">TotalPago</label>
                                <input type="text" id="txtTotalPago" class="form-control" placeholder="Anthony@gmail.com" required>
                            </div>
                        </form>
                    </div>
                </section>

                <!--seccion de la tabla-->
                <section class="card shadow-sm">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0">Lista de registros</h2>
                        <button id="btnrecargar" class="btn btn-light btn-sm">Recargar</button>
                    </div>
                    
                    <div class="card-body">

                        <div id="mensaje" class="d-none" role="alert"></div>

                        <div id="cargando" class="text-center"></div>
                    </div>
                </section>
            </div>
        </main>
    </body>

    <!--script de bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
